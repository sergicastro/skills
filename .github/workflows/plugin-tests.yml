name: Plugin tests

# No paths filter: the workflow runs on every PR so the required `plugin-checks`
# sentinel always reports. The `changes` job decides which plugin jobs run.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      orchestrator: ${{ steps.diff.outputs.orchestrator }}
      explain-interactive: ${{ steps.diff.outputs.explain-interactive }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect changed plugins
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          plugins=(orchestrator explain-interactive)
          if [ "$EVENT" != "pull_request" ]; then
            # manual runs test everything
            for p in "${plugins[@]}"; do echo "$p=true" >> "$GITHUB_OUTPUT"; done
            exit 0
          fi
          changed=$(git diff --name-only "origin/$BASE_REF...HEAD")
          echo "Changed files:"; echo "$changed"
          # editing this workflow re-runs every plugin's tests
          all=false
          grep -qx '.github/workflows/plugin-tests.yml' <<<"$changed" && all=true
          for p in "${plugins[@]}"; do
            if [ "$all" = true ] || grep -q "^plugins/$p/" <<<"$changed"; then
              echo "$p=true" >> "$GITHUB_OUTPUT"
            else
              echo "$p=false" >> "$GITHUB_OUTPUT"
            fi
          done
          cat "$GITHUB_OUTPUT"

  orchestrator:
    needs: changes
    if: needs.changes.outputs.orchestrator == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

  explain-interactive:
    needs: changes
    if: needs.changes.outputs.explain-interactive == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/explain-interactive
    steps:
      - uses: actions/checkout@v4
        with:
          # build.test.mjs and page.test.mjs read the old template.html from commit 7de652b
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          # the default is the newest Chromium snapshot, which changes under us; test what readers run
          chrome-version: stable
          install-dependencies: true
      - name: Allow the Chrome sandbox
        # Ubuntu 24.04 blocks the unprivileged user namespaces Chrome's sandbox needs
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run tests
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: node --test test/*.test.mjs

  # Sentinel: the only check the ruleset requires. Add every new plugin job to `needs`.
  plugin-checks:
    needs: [changes, orchestrator, explain-interactive]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any plugin job failed or was cancelled
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(", ")')
          if [ -n "$bad" ]; then
            echo "::error::Plugin checks did not pass: $bad"
            exit 1
          fi
